name: SW-SENTINEL heartbeat
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping sentinel sweep
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 110 "$SWEEP_URL")
          echo "HTTP $code"
          cat /tmp/out.json || true
          test "$code" = "200"
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
