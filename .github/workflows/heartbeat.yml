name: SW-SENTINEL heartbeat
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping sentinel sweep
        run: |
          echo "SWEEP_URL length: ${#SWEEP_URL}"
          if [ -z "$SWEEP_URL" ]; then echo "SWEEP_URL secret is EMPTY"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 150 "$SWEEP_URL")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/out.json || true
              exit 0
            fi
            sleep 10
          done
          echo "final attempt output:"
          cat /tmp/out.json || true
          exit 1
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
